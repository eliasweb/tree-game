<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Grow Your Oak"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#4A90D9"/>
<title>Grow Your Oak</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#222;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=0,H=0;
var dpr=window.devicePixelRatio||1;

// --- AUDIO ENGINE ---
var ac=null;
var muted=false;
var musicGain=null;
var musicStarted=false;
var prevStage=-1;
var prevSeason=-1;

function initAudio(){
  if(ac)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){ac=null}
}

function playTone(freq,dur,vol,type,delay){
  if(!ac||muted)return;
  var t=ac.currentTime+(delay||0);
  var o=ac.createOscillator();
  var gn=ac.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t);
  gn.gain.setValueAtTime(vol||0.15,t);
  gn.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.15));
  o.connect(gn);gn.connect(ac.destination);
  o.start(t);o.stop(t+(dur||0.15)+0.01);
}

function playTap(){
  if(!ac||muted)return;
  var base=500+Math.random()*200;
  playTone(base,0.08,0.12,'sine');
  playTone(base*1.5,0.06,0.06,'sine',0.02);
}

function playStageUp(){
  if(!ac||muted)return;
  var notes=[523.25,659.25,783.99,1046.5];
  for(var i=0;i<notes.length;i++){
    playTone(notes[i],0.25,0.12,'triangle',i*0.1);
  }
  playTone(1046.5,0.5,0.08,'sine',0.4);
}

function playSeasonChange(){
  if(!ac||muted)return;
  playTone(392,0.4,0.06,'sine');
  playTone(523.25,0.4,0.06,'sine',0.15);
  playTone(659.25,0.5,0.05,'triangle',0.3);
}

var PENTA=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99,880.00];
var musicTimer=0;
var musicNote=0;

function musicTick(){
  if(!ac||muted||!musicStarted)return;
  var t=ac.currentTime;
  var note=PENTA[musicNote%PENTA.length];
  var o=ac.createOscillator();
  var gn=ac.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(note,t);
  gn.gain.setValueAtTime(0.03,t);
  gn.gain.exponentialRampToValueAtTime(0.001,t+1.8);
  o.connect(gn);gn.connect(ac.destination);
  o.start(t);o.stop(t+2);

  if(musicNote%3===0){
    var o2=ac.createOscillator();
    var gn2=ac.createGain();
    o2.type='triangle';
    o2.frequency.setValueAtTime(note/2,t);
    gn2.gain.setValueAtTime(0.02,t);
    gn2.gain.exponentialRampToValueAtTime(0.001,t+2.5);
    o2.connect(gn2);gn2.connect(ac.destination);
    o2.start(t);o2.stop(t+2.6);
  }

  musicNote++;
  if(musicNote>=100)musicNote=0;
}

// --- GAME STATE ---
var STAGES=['Acorn','Sprout','Sapling','Young Tree','Mature Oak','Ancient Oak'];
var THRESHOLDS=[0,10,30,60,100,150];
var SEASONS=['Spring','Summer','Autumn','Winter'];
var SEASON_MS=20000;

var SKY=[['#87CEEB','#E0F0FF'],['#4A90D9','#87CEEB'],['#D4856B','#F5DEB3'],['#8899AA','#C0C8D0']];
var LEAF_C=[['#66BB6A','#81C784','#A5D6A7'],['#2E7D32','#388E3C','#43A047'],['#E65100','#F57C00','#FFB74D'],['#90A4AE','#B0BEC5','#78909C']];
var GND=[['#4CAF50','#388E3C'],['#388E3C','#2E7D32'],['#8D6E63','#6D4C41'],['#CFD8DC','#B0BEC5']];
var SUN_C=['#FFD54F','#FF8F00','#FF6D00','#B0BEC5'];

var KEY='oak_game';
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return{energy:0,taps:0,start:Date.now()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({energy:g.energy,taps:g.taps,start:g.start}))}catch(e){}}

var g=load();
g.season=0;g.sTimer=0;g.sway=0;
g.leaves=[];g.clouds=[];g.snow=[];g.fx=[];
g.lastT=0;

prevStage=getStage(g.energy);
prevSeason=g.season;

function getStage(e){for(var i=THRESHOLDS.length-1;i>=0;i--)if(e>=THRESHOLDS[i])return i;return 0}

function resize(){
  dpr=window.devicePixelRatio||1;
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  if(!g.clouds.length)initClouds();
}

function initClouds(){
  g.clouds=[];
  for(var i=0;i<3;i++)g.clouds.push({x:Math.random()*W,y:30+Math.random()*H*0.2,w:60+Math.random()*80,s:0.2+Math.random()*0.3,o:0.5+Math.random()*0.3});
}

var muteBtn={x:0,y:0,sz:20};

function isMuteHit(px,py){
  return px>=muteBtn.x-muteBtn.sz&&px<=muteBtn.x+muteBtn.sz&&py>=muteBtn.y-muteBtn.sz&&py<=muteBtn.y+muteBtn.sz;
}

function tap(e){
  e.preventDefault();
  initAudio();
  if(!musicStarted){musicStarted=true}
  var r=canvas.getBoundingClientRect();
  var cx,cy;
  if(e.touches){cx=e.touches[0].clientX;cy=e.touches[0].clientY}
  else{cx=e.clientX;cy=e.clientY}
  var x=(cx-r.left)*(canvas.width/r.width)/dpr;
  var y=(cy-r.top)*(canvas.height/r.height)/dpr;

  if(isMuteHit(x,y)){muted=!muted;return}

  g.energy+=1;g.taps+=1;save();
  playTap();
  var ps=[];
  for(var i=0;i<8;i++){var a=Math.PI*2*i/8;ps.push({x:x,y:y,vx:Math.cos(a)*(2+Math.random()*2),vy:Math.sin(a)*(2+Math.random()*2),life:1,sz:3+Math.random()*3})}
  g.fx.push({x:x,y:y,r:0,mr:40,o:1,ps:ps});
}
canvas.addEventListener('click',tap);
canvas.addEventListener('touchstart',tap,{passive:false});
window.addEventListener('resize',resize);
resize();

function rr(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r)}

function drawSky(s){var gr=ctx.createLinearGradient(0,0,0,H*0.75);gr.addColorStop(0,SKY[s][0]);gr.addColorStop(1,SKY[s][1]);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}

function drawSun(s,t){
  var sx=W*0.75+Math.sin(t*0.0003)*30,sy=H*0.12+Math.cos(t*0.0003)*10;
  var c=SUN_C[s],sr=s===3?20:28;
  var gl=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*2.5);gl.addColorStop(0,c+'80');gl.addColorStop(1,c+'00');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(sx,sy,sr*2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
}

function drawCloud(c){
  ctx.fillStyle='rgba(255,255,255,'+c.o+')';
  ctx.beginPath();ctx.arc(c.x,c.y,c.w*0.22,0,Math.PI*2);ctx.arc(c.x+c.w*0.2,c.y-c.w*0.08,c.w*0.18,0,Math.PI*2);ctx.arc(c.x-c.w*0.2,c.y-c.w*0.04,c.w*0.16,0,Math.PI*2);ctx.arc(c.x+c.w*0.1,c.y+c.w*0.06,c.w*0.14,0,Math.PI*2);ctx.fill();
}

function drawGround(s){
  var gy=H*0.72;var gr=ctx.createLinearGradient(0,gy,0,H);gr.addColorStop(0,GND[s][0]);gr.addColorStop(1,GND[s][1]);ctx.fillStyle=gr;
  ctx.beginPath();ctx.moveTo(0,gy+20);ctx.quadraticCurveTo(W*0.25,gy-5,W*0.5,gy+10);ctx.quadraticCurveTo(W*0.75,gy+25,W,gy+15);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  if(s<2){ctx.strokeStyle='#66BB6A';ctx.lineWidth=1.5;for(var i=0;i<20;i++){var gx=W/20*i+10,gy2=gy+15+Math.sin(i*1.3)*5;ctx.beginPath();ctx.moveTo(gx,gy2);ctx.quadraticCurveTo(gx-3,gy2-8,gx-1,gy2-12);ctx.stroke();ctx.beginPath();ctx.moveTo(gx,gy2);ctx.quadraticCurveTo(gx+3,gy2-9,gx+2,gy2-11);ctx.stroke()}}
}

function drawAcorn(cx,cy,sw){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(sw*0.02);
  ctx.fillStyle='#795548';ctx.beginPath();ctx.ellipse(0,-8,10,6,0,Math.PI,0);ctx.fill();
  ctx.strokeStyle='#5D4037';ctx.lineWidth=0.5;for(var i=-8;i<=8;i+=3){ctx.beginPath();ctx.moveTo(i,-10);ctx.lineTo(i,-6);ctx.stroke()}
  ctx.fillStyle='#A1887F';ctx.beginPath();ctx.ellipse(0,2,9,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.ellipse(-3,-1,3,6,-0.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#5D4037';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,-18);ctx.stroke();
  ctx.restore();
}

function drawTree(stage,cx,gy,sw,sn){
  if(stage===0){drawAcorn(cx,gy-5,sw);return}
  ctx.save();ctx.translate(cx,gy);
  var sa=Math.sin(sw)*(0.02/stage);ctx.rotate(sa);
  var tw=3+stage*7,th=15+stage*28;

  if(stage>=3){ctx.strokeStyle='#5D4037';ctx.lineWidth=2+stage*0.5;for(var i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*tw*0.3,0);ctx.quadraticCurveTo(i*tw*1.2,8,i*tw*1.5,15);ctx.stroke()}}

  var tg=ctx.createLinearGradient(-tw/2,0,tw/2,0);tg.addColorStop(0,'#5D4037');tg.addColorStop(0.3,'#795548');tg.addColorStop(0.7,'#6D4C41');tg.addColorStop(1,'#4E342E');ctx.fillStyle=tg;
  ctx.beginPath();ctx.moveTo(-tw/2,0);ctx.lineTo(-tw/3,-th);ctx.lineTo(tw/3,-th);ctx.lineTo(tw/2,0);ctx.closePath();ctx.fill();

  ctx.strokeStyle='rgba(0,0,0,0.1)';ctx.lineWidth=1;for(var i=0;i<stage*2;i++){var by=-Math.random()*th,bx=(Math.random()-0.5)*tw*0.4;ctx.beginPath();ctx.moveTo(bx-3,by);ctx.lineTo(bx+3,by+5);ctx.stroke()}

  if(stage>=2){var bc=Math.min(stage*2,8);ctx.strokeStyle='#5D4037';for(var i=0;i<bc;i++){var sy=-th*(0.4+(i/bc)*0.5),side=i%2===0?-1:1,len=15+stage*8+Math.random()*10,ang=side*(0.4+Math.random()*0.4);ctx.lineWidth=1.5+stage*0.5;ctx.beginPath();ctx.moveTo(0,sy);ctx.quadraticCurveTo(side*len*0.5,sy-len*0.3,side*len*Math.cos(ang),sy-len*Math.sin(0.5));ctx.stroke()}}

  if(stage>=1){
    var lc=LEAF_C[sn],cr=8+stage*16,cy2=-th-cr*0.4,nc=2+stage*3;
    ctx.fillStyle='rgba(0,0,0,0.05)';ctx.beginPath();ctx.ellipse(0,5,cr*1.2,8,0,0,Math.PI*2);ctx.fill();
    for(var i=0;i<nc;i++){var a=Math.PI*2*i/nc+sw*0.01,d=cr*0.4*(0.3+Math.random()*0.7),lx=Math.cos(a)*d,ly=cy2+Math.sin(a)*d*0.6,lr=cr*(0.4+Math.random()*0.3);ctx.fillStyle=sn===3?lc[i%lc.length]+'40':lc[i%lc.length];ctx.beginPath();ctx.arc(lx,ly,lr,0,Math.PI*2);ctx.fill()}
    if(sn!==3){ctx.fillStyle=lc[1];ctx.beginPath();ctx.arc(0,cy2,cr*0.55,0,Math.PI*2);ctx.fill()}
    if(sn===0&&stage>=3){ctx.fillStyle='#F8BBD0';for(var i=0;i<8;i++){var fx2=(Math.random()-0.5)*cr*1.4,fy=cy2+(Math.random()-0.5)*cr*0.8;ctx.beginPath();ctx.arc(fx2,fy,2.5,0,Math.PI*2);ctx.fill()}}
  }

  if(stage===1){ctx.fillStyle='#81C784';ctx.save();ctx.translate(0,-th);ctx.beginPath();ctx.ellipse(-6,-4,5,3,-0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(6,-4,5,3,0.5,0,Math.PI*2);ctx.fill();ctx.restore()}

  ctx.restore();
}

function drawMuteBtn(){
  var bx=W-36,by=H-36,sz=14;
  muteBtn.x=bx;muteBtn.y=by;muteBtn.sz=sz+6;

  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.arc(bx,by,sz+6,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle='#FFF';ctx.lineWidth=2;
  if(muted){
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx-2,by-4);ctx.lineTo(bx+3,by-8);ctx.lineTo(bx+3,by+8);ctx.lineTo(bx-2,by+4);ctx.lineTo(bx-6,by+4);ctx.closePath();ctx.stroke();
    ctx.strokeStyle='#F44336';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(bx+6,by-4);ctx.lineTo(bx+12,by+4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx+12,by-4);ctx.lineTo(bx+6,by+4);ctx.stroke();
  }else{
    ctx.beginPath();ctx.moveTo(bx-6,by-4);ctx.lineTo(bx-2,by-4);ctx.lineTo(bx+3,by-8);ctx.lineTo(bx+3,by+8);ctx.lineTo(bx-2,by+4);ctx.lineTo(bx-6,by+4);ctx.closePath();ctx.stroke();
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(bx+4,by,5,-(Math.PI/3),Math.PI/3);ctx.stroke();
    ctx.beginPath();ctx.arc(bx+4,by,9,-(Math.PI/3),Math.PI/3);ctx.stroke();
  }
}

function frame(t){
  var dt=Math.min(t-g.lastT,50);g.lastT=t;
  if(W===0){requestAnimationFrame(frame);return}
  var gy=H*0.72;

  g.energy+=0.1*(dt/1000);
  g.sTimer+=dt;
  if(g.sTimer>=SEASON_MS){
    g.sTimer=0;g.season=(g.season+1)%4;
    if(g.season!==prevSeason){playSeasonChange();prevSeason=g.season}
  }
  g.sway=t*0.001;
  var stage=getStage(g.energy);

  if(stage!==prevStage&&stage>prevStage){playStageUp();prevStage=stage}
  else if(stage!==prevStage){prevStage=stage}

  musicTimer+=dt;
  if(musicTimer>=2000){musicTimer=0;musicTick()}

  var lr=g.season===2?0.08:g.season===3?0.01:0.03;
  if(stage>=2&&Math.random()<lr){var lcs=LEAF_C[g.season];g.leaves.push({x:Math.random()*W,y:-10,vy:0.5+Math.random(),vx:0,sz:3+Math.random()*5,rot:Math.random()*Math.PI*2,rs:(Math.random()-0.5)*0.05,c:lcs[Math.floor(Math.random()*lcs.length)],wo:Math.random()*Math.PI*2})}
  g.leaves=g.leaves.filter(function(l){l.y+=l.vy;l.x+=Math.sin(l.wo+l.y*0.02)*0.5;l.rot+=l.rs;return l.y<gy+20});
  if(g.leaves.length>50)g.leaves=g.leaves.slice(-50);

  if(g.season===3&&Math.random()<0.1)g.snow.push({x:Math.random()*W,y:-5,vx:(Math.random()-0.5)*0.5,vy:0.5+Math.random(),sz:1.5+Math.random()*2.5});
  g.snow=g.snow.filter(function(s){s.y+=s.vy;s.x+=s.vx+Math.sin(s.y*0.01)*0.3;return s.y<H});
  if(g.snow.length>80)g.snow=g.snow.slice(-80);

  g.clouds.forEach(function(c){c.x+=c.s;if(c.x>W+c.w)c.x=-c.w});

  g.fx=g.fx.filter(function(f){f.r+=2;f.o-=0.03;f.ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=0.03});f.ps=f.ps.filter(function(p){return p.life>0});return f.o>0});

  if(Math.random()<0.03)save();

  ctx.save();ctx.setTransform(dpr,0,0,dpr,0,0);

  drawSky(g.season);drawSun(g.season,t);
  g.clouds.forEach(drawCloud);

  g.snow.forEach(function(s){ctx.fillStyle='rgba(255,255,255,'+(0.6+Math.random()*0.4)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.sz,0,Math.PI*2);ctx.fill()});

  drawGround(g.season);

  g.leaves.forEach(function(l){ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.rot);ctx.fillStyle=l.c;ctx.beginPath();ctx.ellipse(0,0,l.sz,l.sz*0.5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(-l.sz,0);ctx.lineTo(l.sz,0);ctx.stroke();ctx.restore()});

  drawTree(stage,W/2,gy+10,g.sway,g.season);

  g.fx.forEach(function(f){ctx.strokeStyle='rgba(255,215,0,'+f.o+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,215,0,'+f.o+')';ctx.font='bold 16px sans-serif';ctx.fillText('+1',f.x+10,f.y-f.r);f.ps.forEach(function(p){ctx.fillStyle='rgba(255,215,0,'+p.life+')';ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ctx.fill()})});

  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();rr(12,10,140,60,10);ctx.fill();
  ctx.fillStyle='#FFF';ctx.font='bold 16px sans-serif';ctx.fillText('Energy: '+Math.floor(g.energy),24,32);
  ctx.fillStyle='#FFD700';ctx.font='13px sans-serif';ctx.fillText(STAGES[stage],24,50);
  ctx.fillStyle='#B3E5FC';ctx.fillText(SEASONS[g.season],24,64);

  if(stage<5){var nt=THRESHOLDS[stage+1],pt=THRESHOLDS[stage],pr=(g.energy-pt)/(nt-pt);
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();rr(W-152,10,140,30,10);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.beginPath();rr(W-142,18,120,14,7);ctx.fill();
    ctx.fillStyle='#66BB6A';ctx.beginPath();rr(W-142,18,120*Math.min(pr,1),14,7);ctx.fill();
  }

  if(g.energy<3){var pu=Math.sin(t*0.005)*0.3+0.7;ctx.fillStyle='rgba(255,255,255,'+pu+')';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('Tap to grow your oak!',W/2,H*0.55);ctx.textAlign='start'}

  drawMuteBtn();

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
